# Local development services for KeyMood AI (Postgres + Redis).
#   docker compose up -d
# Credentials match backend/.env.example.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: keymood
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: keymood
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  pgdata:
